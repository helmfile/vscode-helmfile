name: Release

# Manually create (publish) a GitHub Release tagged v<version> — e.g. v0.2.0,
# matching package.json — and this workflow builds the VSIX from exactly that
# tag, attaches it (plus a SHA-256 checksum) to the release, and publishes it
# to the Visual Studio Marketplace via trusted publishing (OIDC, no PAT —
# configured on the marketplace for helmfile/vscode-helmfile + release.yml).
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write   # marketplace trusted publishing (OIDC)

jobs:
  vsix:
    name: Build and attach VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          normalized="${tag#v}"   # accept both 0.2.0 and v0.2.0
          if [ "$pkg" != "$normalized" ]; then
            echo "::error::release tag '$tag' does not match package.json version '$pkg'"
            exit 1
          fi
          echo "VERSION=$normalized" >> "$GITHUB_ENV"

      - name: vsce package
        run: npx vsce package --no-dependencies -o "vscode-helmfile-${VERSION}.vsix"

      - name: Generate checksum
        run: shasum -a 256 "vscode-helmfile-${VERSION}.vsix" > "vscode-helmfile-${VERSION}.vsix.sha256"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "vscode-helmfile-${VERSION}.vsix" \
            "vscode-helmfile-${VERSION}.vsix.sha256" \
            --clobber

      # Trusted publishing: vsce >= 3.6 exchanges the GitHub OIDC token for a
      # marketplace publish — no PAT stored anywhere. --skip-duplicate keeps
      # re-published releases from failing the job.
      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce@latest publish --packagePath "vscode-helmfile-${VERSION}.vsix" --skip-duplicate
