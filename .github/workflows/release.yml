name: Release

# Manually create (publish) a GitHub Release tagged v<version> — e.g. v0.2.0,
# matching package.json — and this workflow builds the VSIX from exactly that
# tag and attaches it (plus a SHA-256 checksum) to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  vsix:
    name: Build and attach VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          normalized="${tag#v}"   # accept both 0.2.0 and v0.2.0
          if [ "$pkg" != "$normalized" ]; then
            echo "::error::release tag '$tag' does not match package.json version '$pkg'"
            exit 1
          fi
          echo "VERSION=$normalized" >> "$GITHUB_ENV"

      - name: vsce package
        run: npx vsce package --no-dependencies -o "vscode-helmfile-${VERSION}.vsix"

      - name: Generate checksum
        run: shasum -a 256 "vscode-helmfile-${VERSION}.vsix" > "vscode-helmfile-${VERSION}.vsix.sha256"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "vscode-helmfile-${VERSION}.vsix" \
            "vscode-helmfile-${VERSION}.vsix.sha256" \
            --clobber
